// ---- src/quat.js ----
// Hamilton product: qmul(a, b) = rotate by b first, then by a (Unity's a * b).
function qmul(a, b) {
  return {
    x: a.w * b.x + a.x * b.w + a.y * b.z - a.z * b.y,
    y: a.w * b.y - a.x * b.z + a.y * b.w + a.z * b.x,
    z: a.w * b.z + a.x * b.y - a.y * b.x + a.z * b.w,
    w: a.w * b.w - a.x * b.x - a.y * b.y - a.z * b.z,

}
// v' = q v q* (q assumed unit).
function rotateVec(q, [vx, vy, vz]) {
  const { x, y, z, w } = q;
  const tx = 2 * (y * vz - z * vy), ty = 2 * (z * vx - x * vz), tz = 2 * (x * vy - y * vx);
  return [vx + w * tx + (y * tz - z * ty), vy + w * ty + (z * tx - x * tz), vz + w * tz + (x * ty - y * tx)];

// Heading of the model's local right axis (+X) on the floor plane, Unity Y-up: at yaw t, right = (cos t, 0, -sin t).
// Using the right axis (not forward) keeps the value meaningful for models authored Z-up that carry a 90-degree X tilt;
// the Euler-angle formula is degenerate for those.
function yawFromQuat(q) {

}
function quatFromYaw(yaw) {

  return Math.atan2(fx, fz) + 0; // + 0 turns -0 into 0

const radians = (d) => (d * Math.PI) / 180;

// Pure math for the direction dial and the logarithmic scale slider (no DOM).

const TAU = Math.PI * 2;

// Angle of the pointer around the dial centre in screen coordinates (y grows downward):

function pointerToAngle(cx, cy, px, py) {

// Shortest signed turn from `from` to `to`, in (-PI, PI].

const SLIDER_MAX = 1000, DECADES = 2;

  return Math.min(SLIDER_MAX, Math.max(0, v));

function modelHeight(o, info) {

class CommandStack {
  constructor() { this.done = []; this.undone = []; }
  execute(cmd) { cmd.do(); this.done.push(cmd); this.undone = []; }
  undo() { const c = this.done.pop(); if (c) { c.undo(); this.undone.push(c); } }
  redo() { const c = this.undone.pop(); if (c) { c.do(); this.done.push(c); } }
  get canUndo() { return this.done.length > 0; } get canRedo() { return this.undone.length > 0; }
}

const ARRAYS = ['objects', 'systems', 'games'];
const isScaffold = (o) => o && typeof o.embedded_screen === 'number' && o.id === undefined && o.position === undefined;

    return new Room(raw);

  placed() { return [...this.objects, ...this.systems].filter(isPlaced); } // cartridges in `games` have no id: not editable on the plan
  homeOf(o) { for (const k of ARRAYS) if (this[k].includes(o)) return k; return null; }

  serialize() { return JSON.stringify(this.raw, null, 2); }

    }
    const counts = new Map();
    for (const o of this.all()) if (typeof o.embedded_screen === 'number')
      counts.set(o.embedded_screen, (counts.get(o.embedded_screen) || 0) + 1);
    const max = this.maxScreen();
    for (let i = 0; i <= max; i++) {
      const c = counts.get(i) || 0;
      if (c !== 2) errors.push(`screen ${i} appears ${c === 1 ? 'once' : c + ' times'} (must be exactly twice)`);
    }
    for (const [k] of counts) if (k > max) errors.push(`screen ${k} has no scaffold entry`);

      if (!o.id) errors.push('placed object missing id');
      if (!o.rotation) errors.push(`object ${o.id} missing rotation`);
      else if (!finite(o.rotation, ['x', 'y', 'z', 'w'])) errors.push(`object ${o.id} rotation is not numeric`);
      if (!finite(o.position, ['x', 'y', 'z'])) errors.push(`object ${o.id} position is not numeric`);
      if (o.scale !== undefined && !scaleOk(o.scale)) errors.push(`object ${o.id} scale is not numeric`);
      if (typeof o.frozen !== 'boolean') noFrozen++; // EmuVR writes and loads such objects fine; left untouched
      if (o.path && isArcadeModel(o.id) && typeof o.embedded_screen !== 'number') errors.push(`cabinet ${o.id} has a game but no embedded_screen`);
    }
    if (noFrozen) warnings.push(`${noFrozen} object(s) have no frozen flag (left as-is)`);
    const seen = new Map();
    for (const o of this.placed()) if (o.path) {
      const k = o.path.toLowerCase();
      if (seen.has(k)) warnings.push(`duplicate game: ${o.path}`); else seen.set(k, o);
      if (opts.launchability && opts.launchability(o.path) === 'dead') warnings.push(`dead game: ${o.path}`);
    }

}
// ---- src/catalog.js ----
function normalizeName(s) {
  return String(s).replace(/^Arcade_/i, '').replace(/_[0-9a-f]{8}$/i, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}
function parseTpGamePath(xml) {
  const m = /<GamePath>([\s\S]*?)<\/GamePath>/.exec(xml || '');
  return m ? m[1].trim() : '';
}
const base = (f) => f.replace(/\.[^.]+$/, '');
function buildCatalog(l) {
  const models = (l.ugcNames || []).map(n => ({ id: 'ugc_' + n, name: n, key: normalizeName(n) }));
  const games = [];
  for (const [system, files] of Object.entries(l.gameFiles || {}))
    for (const file of files) games.push({ path: `Games\\${system}\\${file}`, system, file, key: normalizeName(base(file)) });
  const tpProfiles = new Map(Object.entries(l.tpProfiles || {}).map(([n, x]) => [n, { gamePath: parseTpGamePath(x) }]));
  const lowerBase = (a) => new Set((a || []).map(x => base(x).toLowerCase()));
  return {
    models, games,
    winTexts: new Map(Object.entries(l.winTexts || {})),
    tpProfiles,
    m2Roms: lowerBase(l.m2Roms), m3Roms: lowerBase(l.m3Roms),
    videos: new Set((l.videoNames || []).map(v => v.toLowerCase())),
    // Daphne framefiles relative to Emulators\Daphne (e.g. vldp\drugwars\drugwars.txt); null = listing unavailable -> unknown
    daphneFrames: l.daphneFrames ? new Set(l.daphneFrames.map(p => p.replace(/\//g, '\\').replace(/^\.?\\/, '').toLowerCase())) : null,
    // true / false / null (null = not verifiable from here -> unknown)
    tpGamePathExists: l.tpGamePathExists || (() => true),
    fileExists: l.fileExists || (() => true),

  // Recursive file listing (relative paths under `rel`, excluding the `rel` prefix); [] if the folder is missing.
  async function listTree(rel) {

  async function loadCatalog() {

      videoNames: (await safeList('Custom\\Videos\\Arcade')).map(f => f.replace(/\.[^.]+$/, '')),
